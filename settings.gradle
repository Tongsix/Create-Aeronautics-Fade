pluginManagement {
    repositories {
        // 阿里云 Gradle 插件镜像（实测收录了 net.neoforged.moddev 2.0.146）
        maven {
            name = 'AliyunGradlePlugin'
            url = 'https://maven.aliyun.com/repository/gradle-plugin'
        }
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    // 本机只有 JDK 25 时，靠它自动下载 Java 21 工具链。
    // 我们另外在 gradle.properties 里用 org.gradle.java.installations.paths 指了一个手装的 JDK 21，
    // 所以这条只是兜底，正常情况下不会真的去下载。
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'aeronautics-fade'
