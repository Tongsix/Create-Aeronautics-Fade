# ===================== Gradle =====================
org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# ===================== 工具链 =====================
java_version=21
# 手装的 JDK 21（Temurin 21.0.12.1，从清华 TUNA 镜像下载）。
# 显式指路可以完全跳过 foojay 走国外源下载 JDK 的不确定性。
# 换机器时删掉这一行即可，foojay 会自动兜底。
org.gradle.java.installations.paths=E:/jdk21/jdk-21.0.12.1+1

# ===================== Minecraft / NeoForge =====================
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.240
neo_version_range=[21.1.228,)
loader_version_range=[4,)

# ===================== Parchment =====================
parchment_minecraft_version=1.21
parchment_mappings_version=2024.11.10

# ===================== 模组信息 =====================
mod_id=aerofade
mod_name=Aeronautics Fade
mod_license=MIT
mod_version=0.2.0
mod_group_id=com.aerofade
# ⚠️ 这里只能放 ASCII！Gradle 读取 gradle.properties 用的是 ISO-8859-1
# （Java Properties 的历史行为），中文会被读成乱码再写进 jar。
# 所以作者名、credits、中文显示名都直接写在 src/main/resources/META-INF/neoforge.mods.toml 里
# —— 那个文件 NeoForge 是按 UTF-8 读的。
mod_description=Unnamed physics contraptions slowly fade out and are deleted, to reduce server and save performance pressure.

# ===================== 依赖版本（与航空学 1.3.2 对齐）=====================
# 注意：航空学 / Simulated 的 1.3.2 没有发布到 dev Maven（那边最新只到 1.3.1），
# 而玩家实际玩的是 1.3.2。这两个用的是工作区里现成的 1.3.2 jar，
# 由 libs-maven/ 这个本地仓库提供。
create_version=6.0.10-280
ponder_version=1.0.82
flywheel_version=1.0.6
registrate_version=MC1.21-1.3.0+67
sable_version=2.0.5
sable_companion_version=1.6.0
veil_version=4.3.2
aeronautics_version=1.3.2
simulated_version=1.3.2
